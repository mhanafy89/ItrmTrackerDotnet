services:
  itrm-tracker:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__ItrmDatabase: "Server=sqlserver,1433;Database=${SQL_DATABASE:-itrm_tracker};User Id=sa;Password=${SQL_PASSWORD:?set SQL_PASSWORD in .env};Encrypt=true;TrustServerCertificate=true"
      Database__SeedAdminPassword: "${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}"
      Security__CookieSecurePolicy: "SameAsRequest"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # Dev/test SQL Server. For production point the connection string at your real server and drop this service.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?set SQL_PASSWORD in .env}
    volumes:
      - itrm-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  itrm-sqldata:
